spring:

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PWD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    show-sql: true


server:
  servlet:
    session:
      cookie:
        secure: true
  address: 0.0.0.0
  port: ${API_SERVICE_PORT}
management:
  endpoints:
    web:
      exposure:
        include: health,info

python:
  service:
    url: http://${SCRAPER_SERVICE_HOST}:${SCRAPER_SERVICE_PORT}