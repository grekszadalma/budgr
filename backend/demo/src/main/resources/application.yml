spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/budget_management
    username: budget_user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    show-sql: true


server:
  address: 0.0.0.0
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info

python:
  service:
    url: http://python-service:5000