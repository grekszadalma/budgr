name: Backend CI

on:
  push:
    branches:
      - dev/v1.0.0
  pull_request:
    branches:
      - dev/v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build backend
        run: |
          cd backend/demo
          ./mvnw clean package -DskipTests