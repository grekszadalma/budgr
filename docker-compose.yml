version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: http://localhost:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - database
      - python-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/budget_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres123
      SCRAPER_SERVICE_HOST: python-service
      SCRAPER_SERVICE_PORT: 5000

  python-service:
    build:
      context: ./price_checker
    ports:
      - "5000:5000"

  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: budget_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: